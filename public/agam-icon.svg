<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean Ivory / Soft Warm Background -->
  <rect width="512" height="512" rx="128" fill="#FDF8F0" />

  <!-- Centered House Roof, Window & Letter 'g' Shape -->
  <g transform="translate(106, 100)">
    <!-- Deep Forest Green Ring / Arch of 'g' -->
    <circle cx="150" cy="150" r="100" stroke="#073B32" stroke-width="28" fill="none" />
    
    <!-- Descending loop of 'g' -->
    <path
      d="M 250,150 L 250,250 C 250,310 205,348 145,348 C 90,348 55,315 48,275"
      stroke="#073B32"
      stroke-width="28"
      stroke-linecap="round"
      fill="none"
    />

    <!-- House Gable / Roof inside 'g' -->
    <path
      d="M 95,150 L 150,95 L 205,150"
      stroke="#E8821B"
      stroke-width="16"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <!-- 4-Pane Amber Glowing Window -->
    <g transform="translate(130, 160)">
      <rect x="0" y="0" width="16" height="16" rx="3" fill="#E8821B" />
      <rect x="24" y="0" width="16" height="16" rx="3" fill="#E8821B" />
      <rect x="0" y="24" width="16" height="16" rx="3" fill="#E8821B" />
      <rect x="24" y="24" width="16" height="16" rx="3" fill="#E8821B" />
    </g>
  </g>
</svg>
